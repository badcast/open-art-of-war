name: Android Build

on:
  push:
    branches: [main, "android-*"]
    tags: ["v*"]
    paths:
      - 'android-setup/**'
      - 'src/**'
      - 'include/**'
      - '3rdParty/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android-setup/**'
      - 'src/**'
      - 'include/**'
      - '3rdParty/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - '.github/workflows/android.yml'
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Android (NDK, arm64-v8a + x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The Android SDK is preinstalled on the runner ($ANDROID_HOME); only the NDK and CMake are picked here
      - name: Install NDK and CMake
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n 1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "ndk;26.1.10909125" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # SDLActivity (Java) is not in this repository: copy it from the SDL release the native build uses
      - name: Fetch the Java sources of SDL
        run: ./android-setup/fetch-sdl-java.sh

      - name: Cache native dependencies
        uses: actions/cache@v4
        with:
          path: android-setup/app/.cxx
          key: android-cxx-${{ hashFiles('cmake/AndroidDeps.cmake') }}

      - name: Build the debug APK
        working-directory: android-setup
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: openaow-android-debug
          path: android-setup/app/build/outputs/apk/debug/*.apk

      - name: Attach the APK to the release (tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android-setup/app/build/outputs/apk/debug/*.apk "openaow-android-${GITHUB_REF_NAME}.apk"
          # (the release job of build.yml makes the release; wait for it)
          for i in $(seq 1 30); do
            gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && break
            sleep 60
          done
          gh release upload "$GITHUB_REF_NAME" "openaow-android-${GITHUB_REF_NAME}.apk" --repo "$GITHUB_REPOSITORY" --clobber
