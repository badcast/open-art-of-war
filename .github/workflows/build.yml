name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      data_urls:
        description: "Game data to put into the packages (one URL per line, *.blob and *.mod); empty: the repository variable GAME_DATA_URLS"
        required: false
        default: ""

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# The game opens a window even for --test; the dummy drivers let it run on a headless runner
env:
  SDL_VIDEODRIVER: dummy
  SDL_AUDIODRIVER: dummy
  # Game data of the packages (assets.blob, *.mod): Settings -> Secrets and variables -> Actions (docs/ci-game-data.md)
  GAME_DATA_URLS: ${{ inputs.data_urls || vars.GAME_DATA_URLS || secrets.GAME_DATA_URLS }}
  GAME_DATA_TOKEN: ${{ secrets.GAME_DATA_TOKEN }}

jobs:
  linux:
    name: Linux (GCC)
    runs-on: ubuntu-latest
    # SDL3 is not packaged for Ubuntu LTS yet; Arch has it (and is what the project is developed on)
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm base-devel cmake ninja git python sdl3 sdl3_ttf yaml-cpp nlohmann-json gettext libarchive zstd pkgconf
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
      - name: Test (needs assets/, which are not in the repo)
        if: hashFiles('assets/data/graphics_data.json') != ''
        run: |
          set -o pipefail
          ./build/openaow --test | tee test.log
          echo "linux $(awk '/^DETERMINISM-HASH/ {print $2}' test.log)" > determinism-linux.txt
      - uses: actions/upload-artifact@v4
        if: hashFiles('assets/data/graphics_data.json') != ''
        with:
          name: determinism-linux
          path: determinism-linux.txt
      - name: Network tests
        run: ctest --test-dir build --output-on-failure --no-tests=error -R "^openaow-net-tests$"
      - name: Fetch the game data (assets.blob, mods)
        shell: bash
        run: tools/fetch_game_data.sh game-data
      - name: Package
        # (a tarball keeps the executable bits; an artifact folder would lose them)
        run: |
          mkdir dist
          cp game-data/*.blob dist/ 2>/dev/null || true
          mkdir -p dist/mods && cp game-data/*.mod dist/mods/ 2>/dev/null || true
          cp -a build/openaow build/openaow-server build/openaow-charactereditor build/openaow-mapeditor build/libopenaow.so* dist/
          tar -czf openaow-linux-x64.tar.gz -C dist .
      - uses: actions/upload-artifact@v4
        with:
          name: openaow-linux-x64
          path: openaow-linux-x64.tar.gz

  windows-msvc:
    name: Windows (MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\vcpkg\archives
          key: vcpkg-msvc-${{ hashFiles('.github/workflows/build.yml') }}
      - name: Install dependencies
        run: C:\vcpkg\vcpkg.exe install sdl3 sdl3-ttf yaml-cpp nlohmann-json gettext-libintl "libarchive[zstd]" pkgconf --triplet x64-windows
      - name: Configure
        run: >
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake
          -DVCPKG_TARGET_TRIPLET=x64-windows
      - name: Build
        run: cmake --build build
      - name: Test (needs assets/, which are not in the repo)
        if: hashFiles('assets/data/graphics_data.json') != ''
        shell: bash
        run: |
          set -o pipefail
          build/openaow.exe --test | tee test.log
          echo "windows-msvc $(awk '/^DETERMINISM-HASH/ {print $2}' test.log)" > determinism-windows-msvc.txt
      - uses: actions/upload-artifact@v4
        if: hashFiles('assets/data/graphics_data.json') != ''
        with:
          name: determinism-windows-msvc
          path: determinism-windows-msvc.txt
      - name: Network tests
        run: ctest --test-dir build --output-on-failure --no-tests=error -R "^openaow-net-tests$"
      - name: Fetch the game data (assets.blob, mods)
        shell: bash
        run: tools/fetch_game_data.sh game-data
      - name: Package
        shell: bash
        run: |
          mkdir dist
          cp game-data/*.blob dist/ 2>/dev/null || true
          mkdir -p dist/mods && cp game-data/*.mod dist/mods/ 2>/dev/null || true
          cp build/*.exe build/*.dll dist/
      - uses: actions/upload-artifact@v4
        with:
          name: openaow-windows-msvc-x64
          path: dist

  windows-mingw:
    name: Windows (MinGW)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-python
            mingw-w64-x86_64-sdl3
            mingw-w64-x86_64-sdl3-ttf
            mingw-w64-x86_64-yaml-cpp
            mingw-w64-x86_64-nlohmann-json
            mingw-w64-x86_64-libarchive
            mingw-w64-x86_64-zstd
            mingw-w64-x86_64-gettext-runtime
            mingw-w64-x86_64-gettext-tools
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
      - name: Test (needs assets/, which are not in the repo)
        if: hashFiles('assets/data/graphics_data.json') != ''
        run: |
          set -o pipefail
          ./build/openaow.exe --test | tee test.log
          echo "windows-mingw $(awk '/^DETERMINISM-HASH/ {print $2}' test.log)" > determinism-windows-mingw.txt
      - uses: actions/upload-artifact@v4
        if: hashFiles('assets/data/graphics_data.json') != ''
        with:
          name: determinism-windows-mingw
          path: determinism-windows-mingw.txt
      - name: Network tests
        run: ctest --test-dir build --output-on-failure --no-tests=error -R "^openaow-net-tests$"
      - name: Fetch the game data (assets.blob, mods)
        shell: bash
        run: tools/fetch_game_data.sh game-data
      - name: Package
        run: |
          mkdir dist
          cp game-data/*.blob dist/ 2>/dev/null || true
          mkdir -p dist/mods && cp game-data/*.mod dist/mods/ 2>/dev/null || true
          cp build/*.exe build/*.dll dist/
          # runtime DLLs (SDL3, yaml-cpp, libintl ...) so the folder runs outside MSYS2
          for exe in dist/*.exe; do
            ldd "$exe" | awk '/\/mingw64\// {print $3}' | xargs -r -I{} cp -n {} dist/
          done
      - uses: actions/upload-artifact@v4
        with:
          name: openaow-windows-mingw-x64
          path: dist

  macos:
    name: macOS (Clang)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: brew install cmake ninja sdl3 sdl3_ttf yaml-cpp nlohmann-json gettext libarchive zstd pkgconf spirv-cross
      - name: Configure
        # gettext and libarchive are keg-only on Homebrew
        env:
          PKG_CONFIG_PATH: /opt/homebrew/opt/libarchive/lib/pkgconfig:/usr/local/opt/libarchive/lib/pkgconfig
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$(brew --prefix gettext)"
      - name: Build
        run: cmake --build build
      - name: Test (needs assets/, which are not in the repo)
        if: hashFiles('assets/data/graphics_data.json') != ''
        run: |
          set -o pipefail
          ./build/openaow --test | tee test.log
          echo "macos $(awk '/^DETERMINISM-HASH/ {print $2}' test.log)" > determinism-macos.txt
      - uses: actions/upload-artifact@v4
        if: hashFiles('assets/data/graphics_data.json') != ''
        with:
          name: determinism-macos
          path: determinism-macos.txt
      - name: Network tests
        run: ctest --test-dir build --output-on-failure --no-tests=error -R "^openaow-net-tests$"
      - name: Fetch the game data (assets.blob, mods)
        shell: bash
        run: tools/fetch_game_data.sh game-data
      - name: Package
        # (a tarball keeps the executable bits; an artifact folder would lose them)
        run: |
          mkdir dist
          cp game-data/*.blob dist/ 2>/dev/null || true
          mkdir -p dist/mods && cp game-data/*.mod dist/mods/ 2>/dev/null || true
          cp -a build/openaow build/openaow-charactereditor build/openaow-mapeditor build/libopenaow*.dylib dist/
          tar -czf openaow-macos-arm64.tar.gz -C dist .
      - uses: actions/upload-artifact@v4
        with:
          name: openaow-macos-arm64
          path: openaow-macos-arm64.tar.gz

  # Lockstep needs the simulation to give the same bits everywhere: the scripted skirmish of the
  # self-test must end with the same world checksum on every platform and compiler
  determinism:
    name: Cross-platform determinism
    needs: [linux, windows-msvc, windows-mingw, macos]
    runs-on: ubuntu-latest
    # Disabled while assets/ is not in the repo (no game self-test, so no hashes); set to true to re-enable
    if: ${{ false }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: determinism-*
          merge-multiple: true
          path: hashes
      - name: Compare world checksums
        run: |
          cat hashes/*.txt
          test "$(awk '{print $2}' hashes/*.txt | sort -u | wc -l)" -eq 1

  # A tag v* (git tag v1.2.0 && git push origin v1.2.0) publishes the builds of all platforms as a GitHub Release.
  # Pushes to main, pull requests and manual runs only build: their packages stay workflow artifacts.
  release:
    name: GitHub Release
    needs: [linux, windows-msvc, windows-mingw, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: openaow-*
          path: artifacts
      - name: Name the packages after the tag
        run: |
          mkdir release
          for dir in artifacts/*/; do
            name=$(basename "$dir")
            if ls "$dir"*.tar.gz >/dev/null 2>&1; then
              cp "$dir"*.tar.gz "release/${name}-${GITHUB_REF_NAME}.tar.gz"
            else
              (cd "$dir" && zip -qr "$GITHUB_WORKSPACE/release/${name}-${GITHUB_REF_NAME}.zip" .)
            fi
          done
          ls -l release
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # (a re-run of the same tag replaces the files of the release it made before)
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" \
              --title "Open Art of War $GITHUB_REF_NAME" --generate-notes --verify-tag
          fi
